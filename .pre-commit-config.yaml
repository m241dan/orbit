repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: lint-imports
        name: lint-imports (frontend/backend separation)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
