[project]
name = "orbit"
version = "0.1.0"
description = "Orbit command-line tool"
readme = "README.md"
authors = [
    { name = "Daniel R Koris", email = "korisd@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.0",
    "textual>=8.2.8",
    "tomlkit>=0.15.1",
    "typer>=0.27.3",
]

[project.scripts]
orbit = "orbit.cli:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "lizard>=1.24.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# The prompt marker in front of the user's prompts in the conversation.
allowed-confusables = ["❯"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -n auto"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["orbit"]
branch = true
# Entry-point shim: `python -m orbit` just calls the Typer app tested in test_cli.
omit = ["*/orbit/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    'if __name__ == .__main__.:',
    "if TYPE_CHECKING:",
    "assert_never\\(",
]

# Keep frontend and backend apart; they meet only in orbit.cli via orbit.protocol.
[tool.importlinter]
root_package = "orbit"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Frontend and backend are independent"
type = "independence"
modules = ["orbit.agent", "orbit.tui"]

[[tool.importlinter.contracts]]
name = "Protocol depends on neither side"
type = "forbidden"
source_modules = ["orbit.protocol"]
forbidden_modules = ["orbit.agent", "orbit.tui", "orbit.cli", "textual", "rich"]

[[tool.importlinter.contracts]]
name = "Backend has no UI dependencies"
type = "forbidden"
source_modules = ["orbit.agent"]
forbidden_modules = ["textual", "rich", "typer"]

# Profiling is wired in by the CLI alone, and knows nothing of what it profiles.
[[tool.importlinter.contracts]]
name = "Profiling stands apart from the backend and frontend"
type = "forbidden"
source_modules = ["orbit.profiling"]
forbidden_modules = ["orbit.agent", "orbit.tui", "orbit.protocol", "orbit.cli"]

[[tool.importlinter.contracts]]
name = "Only the CLI uses profiling"
type = "forbidden"
source_modules = ["orbit.agent", "orbit.tui", "orbit.protocol"]
forbidden_modules = ["orbit.profiling"]

# Inside the backend: external adapters over the application over the domain. A layer may
# import the ones below it, never above.
[[tool.importlinter.contracts]]
name = "Backend layers: external > application > domain"
type = "layers"
containers = ["orbit.agent"]
layers = ["external", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Domain does no I/O"
type = "forbidden"
source_modules = ["orbit.agent.domain"]
forbidden_modules = ["asyncio", "subprocess", "os", "pathlib", "json", "uuid", "time"]
# The domain uses the protocol's messages; the threaded session it also exports is the CLI's.
ignore_imports = ["orbit.protocol -> orbit.protocol.threaded"]

# MCP, the web server it runs on and the HTTP client are details of the external adapters.
# The CLI wires the adapters up, so it reaches them indirectly.
[[tool.importlinter.contracts]]
name = "Only external adapters use MCP or HTTP"
type = "forbidden"
source_modules = [
    "orbit.agent.application",
    "orbit.agent.domain",
    "orbit.protocol",
    "orbit.tui",
    "orbit.cli",
]
forbidden_modules = ["mcp", "uvicorn", "starlette", "httpx"]
allow_indirect_imports = true

# The frontend's presentation rules are plain functions; the widgets are what touch Textual.
[[tool.importlinter.contracts]]
name = "TUI view is independent of Textual"
type = "forbidden"
source_modules = ["orbit.tui.view"]
forbidden_modules = [
    "textual",
    "orbit.tui.agents",
    "orbit.tui.app",
    "orbit.tui.conversation",
    "orbit.tui.detail",
    "orbit.tui.entries",
    "orbit.tui.panels",
    "orbit.tui.proposals",
    "orbit.tui.tabs",
    "orbit.tui.tasks",
    "orbit.tui.transcript",
    "orbit.tui.widgets",
    "orbit.tui.working",
]
