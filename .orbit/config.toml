# The triggers that turn events into tasks or check runs, by name: the shipped ones, and your own.

# [triggers.review]
# The event it fires on, such as "task_landed", "commits" or "manual".
# on = "task_landed"
# The role of the task it queues.
# role = "reviewer"
# Instead of a role, the checks it runs: "task-checks", or a named set.
# checks: unset
# The task's prompt: the text, or a Markdown file under .orbit/ it names.
# prompt: orbit's own review.md
# The events it takes, by their fields, each a value or a list of values.
# when = {}
# The named rules that may hold it back: review-rounds, suggestions-pending, not-queued or dedupe.
# guards = ["review-rounds"]
# With on = "commits", how many matching landings it fires after.
# every: unset
# Whether you can fire it yourself.
# manual = false
# What it's called where you fire it; a manual trigger needs one.
# label: unset
# Whether its task is added as a draft, for you to accept.
# draft = false
# Whether it fires at all.
# enabled = true

# [triggers.super-review]
# The event it fires on, such as "task_landed", "commits" or "manual".
# on = "commits"
# The role of the task it queues.
# role = "super-reviewer"
# Instead of a role, the checks it runs: "task-checks", or a named set.
# checks: unset
# The task's prompt: the text, or a Markdown file under .orbit/ it names.
# prompt: orbit's own super-review.md
# The events it takes, by their fields, each a value or a list of values.
# when = {origin = ["manual", "planner"]}
# The named rules that may hold it back: review-rounds, suggestions-pending, not-queued or dedupe.
# guards = ["suggestions-pending"]
# With on = "commits", how many matching landings it fires after.
# every = 10
# Whether you can fire it yourself.
# manual = true
# What it's called where you fire it; a manual trigger needs one.
# label = "Super review"
# Whether its task is added as a draft, for you to accept.
# draft = false
# Whether it fires at all.
# enabled = true

# [triggers.configure-checks]
# The event it fires on, such as "task_landed", "commits" or "manual".
# on = "manual"
# The role of the task it queues.
# role = "configurator"
# Instead of a role, the checks it runs: "task-checks", or a named set.
# checks: unset
# The task's prompt: the text, or a Markdown file under .orbit/ it names.
# prompt: orbit's own configure-checks.md
# The events it takes, by their fields, each a value or a list of values.
# when = {}
# The named rules that may hold it back: review-rounds, suggestions-pending, not-queued or dedupe.
# guards = []
# With on = "commits", how many matching landings it fires after.
# every: unset
# Whether you can fire it yourself.
# manual = true
# What it's called where you fire it; a manual trigger needs one.
# label = "Set up checks"
# Whether its task is added as a draft, for you to accept.
# draft = false
# Whether it fires at all.
# enabled = true

# [triggers.set-up-verification]
# The event it fires on, such as "task_landed", "commits" or "manual".
# on = "session_started"
# The role of the task it queues.
# role = "configurator"
# Instead of a role, the checks it runs: "task-checks", or a named set.
# checks: unset
# The task's prompt: the text, or a Markdown file under .orbit/ it names.
# prompt: orbit's own configure-checks.md
# The events it takes, by their fields, each a value or a list of values.
# when = {verification = "missing"}
# The named rules that may hold it back: review-rounds, suggestions-pending, not-queued or dedupe.
# guards = ["not-queued"]
# With on = "commits", how many matching landings it fires after.
# every: unset
# Whether you can fire it yourself.
# manual = false
# What it's called where you fire it; a manual trigger needs one.
# label: unset
# Whether its task is added as a draft, for you to accept.
# draft = false
# Whether it fires at all.
# enabled = true

# [triggers.startup-check]
# The event it fires on, such as "task_landed", "commits" or "manual".
# on = "session_started"
# The role of the task it queues.
# role: unset
# Instead of a role, the checks it runs: "task-checks", or a named set.
# checks = "task-checks"
# The task's prompt: the text, or a Markdown file under .orbit/ it names.
# prompt: unset
# The events it takes, by their fields, each a value or a list of values.
# when = {verification = "configured"}
# The named rules that may hold it back: review-rounds, suggestions-pending, not-queued or dedupe.
# guards = []
# With on = "commits", how many matching landings it fires after.
