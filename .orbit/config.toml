# Skills for the code under some paths, given to every agent along with its role's.
[[skills]]
paths = ["src", "tests"]
use = ["application", "python", "layers", "orbit"]

# The MCP servers roles may use, by name, which orbit proxies through its own. For example:
# [mcp.github]
# The command that starts it, as a process of orbit's: its program and arguments.
# command = ["github-mcp-server", "stdio"]
# Its environment variables; $NAME or ${NAME} in a value is filled in from orbit's.
# env = {GITHUB_TOKEN = "$GITHUB_TOKEN"}
# Whether the agents share one connection to it, rather than each having its own.
# shared = true
# How long a connection it's idle on is kept, in minutes.
# idle_minutes = 10
# How long a call to one of its tools may take, in seconds.
# timeout_seconds = 300
# Which of its tools' calls wait for you to allow or deny them: none, all (true), or a list.
# approve = ["create_issue"]

# An MCP server that's already running. For example:
# [mcp.semgrep]
# The URL it serves MCP at, if orbit doesn't start it.
# url = "http://127.0.0.1:3010/mcp"
# With a url, its HTTP headers; $NAME or ${NAME} in a value is filled in from orbit's.
# headers = {Authorization = "Bearer ${SEMGREP_TOKEN}"}

# The MCP servers a role's agents may use, in its tools table. For example:
# [roles.license-reviewer.tools]
# The MCP servers its agents may use: a name for all its tools, or { server, tools }.
# mcp = ["semgrep", {server = "github", tools = ["get_issue", "list_issues", "create_issue"]}]

# Coming in a later version of orbit; leave commented out until then.

# A model endpoint for the built-in harness, which a role's model names.
# [models.local-coder]
# The provider and model id, as LangChain reads them.
# model = "openai:qwen3-coder"
# The endpoint's URL, such as an OpenAI-compatible server's.
# base_url = "http://127.0.0.1:11434/v1"
# How many tokens the model's context holds.
# context_window = 32768
