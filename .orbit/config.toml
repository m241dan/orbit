# orbit's project configuration, every setting commented out at its default.
# Uncomment the settings you change; the others keep their defaults.

# In-session fixes asked of the same agent before its task falls back.
# fix_attempts = 5
# Verification steps an agent may run itself before claiming done.
# max_checks = 20
# Fresh-agent fix tasks one task's chain may queue for each failing step.
# fallback_fixes = 3
# Rounds of review-suggested work after which review pauses.
# review_rounds = 3
# Commits between super reviews; moving to [triggers.super-review] every.
# super_review_every = 10
# Tasks one review may suggest.
# review_suggestions = 5
# Tasks one super review may suggest.
# super_review_suggestions = 10
# Code files a super review reads besides those changed since the last one; 0, none.
# super_review_sample = 10

# The verification steps, in order; the task checks, in no set, verify every task.
# Quick checks first, so a failure shows up in seconds rather than after the tests.
[[verification.steps]]
name = "Ruff lint"
command = ["uv", "run", "ruff", "check"]

[[verification.steps]]
name = "Ruff format"
command = ["uv", "run", "ruff", "format", "--check"]

[[verification.steps]]
name = "Type check (mypy)"
command = ["uv", "run", "mypy"]

[[verification.steps]]
name = "Import contracts"
command = ["uv", "run", "lint-imports"]

# Every function, tests included: cyclomatic complexity at most 6 and at most 100 lines. The
# limit of 5 parameters is held by a test, tests/test_parameter_limit.py, rather than Lizard.
[[verification.steps]]
name = "Code quality (Lizard)"
command = ["uv", "run", "lizard", "src", "tests", "-w", "-C", "6", "-L", "100"]

# The slowest check, but a task check like the rest, so every task runs it. A check to run
# less often would join a named set, which a trigger runs:
# set = "<name>"
[[verification.steps]]
name = "Unit tests with 100% coverage"
command = ["uv", "run", "pytest", "--cov", "--cov-fail-under=100"]

# The named sets steps are in, by name; a trigger runs one with checks = "<name>". For example:
# [verification.sets.mutation]
# Whether its failure holds merges until a fix lands; otherwise it only reports.
# holds_merges = true

# How the coder's worktree is set up; with none, nothing is.
# Bring the worktree's environment in line with the lock file whenever it changes.
[setup]
command = ["uv", "sync", "--frozen"]
watch = ["uv.lock"]

# The roles agents work in, by name: the built-in ones, and your own.

# [roles.planner]
# What its agents are told about their job: the text, or a Markdown file under .orbit/ it names.
# instructions: orbit's own planner.md
# Its tasks' model, an alias such as "opus" or a full id; unset, the user config's, else the CLI's.
# model: unset
# How its tasks may use the CLI's tools: "off", "restricted" (read and search) or "full".
# tool_access = "restricted"
# The orbit tools its agents may call.
# tools = ["propose_task", "report_progress", "save_report", "list_reports", "read_report"]
# Whether its agents' claims of being done are verified.
# verify = false
# How long its agents may take, in minutes; unset, no limit.
# timeout_minutes: unset
# The lane that runs its agents, a plain name; a lane runs one task at a time.
# lane = "planner"
# Where its agents work: "worktree", "snapshot", "checkout", "none" or "copy".
# workspace = "checkout"
# Whether you talk to it, as you do the planner, rather than it taking tasks.
# conversation = true
# Whether its finished work is committed and merged.
# merge = false
# Whether it runs at all.
# enabled = true
# Its effort: "low", "medium", "high", "xhigh" or "max"; unset, the user config's, else the CLI's.
# effort: unset
# The runtime its agents run on: "claude" or "kiro". Left out, the user config's, else "claude".
# runtime = "claude"
# The other conversational roles a conversational role may consult, by name.
# consults = ["experimenter"]
# Consultations it may start in an hour; 0, no limit.
# consult_limit_per_hour = 6
# How long its copy is kept after its conversation's last turn, in hours.
# copy_ttl_hours = 24.0
# The skills its agents get, by name: orbit's own, or the project's in .orbit/skills/.
# skills = ["code-style"]

