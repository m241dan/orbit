# The built-in roles. Each is told the Markdown file beside this one that its instructions name;
# a project's .orbit/config.toml can change any of their fields.

[roles.planner]
instructions = "planner.md"
skills = ["code-style"]
consults = ["experimenter"]
verify = false
lane = "planner"
workspace = "checkout"
conversation = true
merge = false
enabled = true
runtime = "claude"

[roles.planner.tools]
orbit = ["propose_task", "report_progress", "save_report", "list_reports", "read_report"]
workspace = "read"
web = true

[roles.experimenter]
instructions = "experimenter.md"
model = "sonnet"
timeout_minutes = 30
verify = false
lane = "experimenter"
workspace = "copy"
conversation = true
merge = false
enabled = true
runtime = "claude"

[roles.experimenter.tools]
orbit = ["report_progress", "save_report", "list_reports", "read_report"]
workspace = "shell"
web = true

[roles.coder]
instructions = "coder.md"
skills = ["code-style", "security"]
verify = true
lane = "work"
workspace = "worktree"
conversation = false
merge = true
enabled = true
runtime = "claude"

[roles.coder.tools]
orbit = ["get_task", "complete_task", "run_check", "report_progress", "give_up"]
workspace = "shell"
web = true

[roles.reviewer]
instructions = "reviewer.md"
skills = [
    "code-style",
    "security",
    "review-fit",
    "review-bugs",
    "review-tests",
    "review-logic",
    "review-security",
    "review-performance",
    "review-style",
    "review-drift",
    "review-scaling",
]
verify = false
lane = "review"
workspace = "snapshot"
conversation = false
merge = false
enabled = true
runtime = "claude"

[roles.reviewer.tools]
orbit = [
    "get_task",
    "complete_task",
    "report_progress",
    "give_up",
    "suggest_task",
    "dismiss_finding",
]
workspace = "read"
web = true

[roles.configurator]
instructions = "configurator.md"
skills = ["python", "cpp"]
verify = false
lane = "work"
workspace = "worktree"
conversation = false
merge = false
enabled = true
runtime = "claude"

[roles.configurator.tools]
orbit = ["get_task", "propose_checks", "report_progress", "give_up"]
workspace = "read"
web = true

# The per-commit lens reviewers: each reviews a landed commit through one review lens and reports
# findings, which the reviewer, the merge pass, then files as tasks or dismisses.

[roles.fit-reviewer]
instructions = "lens-reviewer.md"
skills = ["code-style", "review-fit"]
verify = false
lane = "review"
workspace = "snapshot"
conversation = false
merge = false
enabled = true
runtime = "claude"

[roles.fit-reviewer.tools]
orbit = ["get_task", "complete_task", "report_progress", "give_up", "report_finding"]
workspace = "read"
web = true

