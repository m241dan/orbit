# The built-in roles. Each is told the Markdown file beside this one that its instructions name;
# a project's .orbit/config.toml can change any of their fields.

[roles.planner]
instructions = "planner.md"
tool_access = "restricted"
tools = ["propose_task", "report_progress", "save_report", "list_reports", "read_report"]
consults = ["experimenter"]
verify = false
lane = "planner"
workspace = "checkout"
conversation = true
merge = false
enabled = true
runtime = "claude"

[roles.experimenter]
instructions = "experimenter.md"
model = "sonnet"
timeout_minutes = 30
tool_access = "full"
tools = ["report_progress", "save_report", "list_reports", "read_report"]
verify = false
lane = "experimenter"
workspace = "copy"
conversation = true
merge = false
enabled = true
runtime = "claude"

[roles.coder]
instructions = "coder.md"
tool_access = "full"
tools = ["get_task", "complete_task", "run_check", "report_progress", "give_up"]
verify = true
lane = "work"
workspace = "worktree"
conversation = false
merge = true
enabled = true
runtime = "claude"

[roles.reviewer]
instructions = "reviewer.md"
tool_access = "restricted"
tools = ["get_task", "complete_task", "report_progress", "give_up", "suggest_task"]
verify = false
lane = "review"
workspace = "snapshot"
conversation = false
merge = false
enabled = true
runtime = "claude"

[roles.super-reviewer]
instructions = "super-reviewer.md"
model = "opus"
tool_access = "restricted"
tools = ["get_task", "complete_task", "report_progress", "give_up", "suggest_task"]
verify = false
lane = "review"
workspace = "snapshot"
conversation = false
merge = false
enabled = true
runtime = "claude"

[roles.configurator]
instructions = "configurator.md"
tool_access = "restricted"
tools = ["get_task", "propose_checks", "report_progress", "give_up"]
verify = false
lane = "work"
workspace = "worktree"
conversation = false
merge = false
enabled = true
runtime = "claude"
