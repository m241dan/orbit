# The triggers shipped with orbit, each turning an event into a task for a role or a run of
# checks. A trigger's prompt names its template, a Markdown file beside this one.

[triggers.fit-review]
on = "task_landed"
role = "fit-reviewer"
prompt = "lens-review.md"
guards = ["review-rounds"]

[triggers.bugs-review]
on = "task_landed"
role = "bugs-reviewer"
prompt = "lens-review.md"
guards = ["review-rounds"]

[triggers.tests-review]
on = "task_landed"
role = "tests-reviewer"
prompt = "lens-review.md"
guards = ["review-rounds"]

[triggers.logic-review]
on = "task_landed"
role = "logic-reviewer"
prompt = "lens-review.md"
guards = ["review-rounds"]

[triggers.security-review]
on = "task_landed"
role = "security-reviewer"
prompt = "lens-review.md"
guards = ["review-rounds"]

[triggers.performance-review]
on = "task_landed"
role = "performance-reviewer"
prompt = "lens-review.md"
guards = ["review-rounds"]

[triggers.merge-pass]
on = "reviews_finished"
role = "reviewer"
prompt = "merge-pass.md"
when = { findings = "some" }

[triggers.super-review]
on = "commits"
role = "super-reviewer"
prompt = "super-review.md"
when = { origin = ["manual", "planner"] }
guards = ["suggestions-pending"]
every = 10
manual = true
label = "Super review"

[triggers.configure-checks]
on = "manual"
role = "configurator"
prompt = "configure-checks.md"
manual = true
label = "Set up checks"

[triggers.set-up-verification]
on = "session_started"
role = "configurator"
prompt = "configure-checks.md"
when = { verification = "missing" }
guards = ["not-queued"]

[triggers.startup-check]
on = "session_started"
checks = "task-checks"
when = { verification = "configured" }

[triggers.startup-fix]
on = "startup_check_failed"
role = "coder"
prompt = "startup-fix.md"
draft = true
