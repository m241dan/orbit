# The triggers shipped with orbit, each turning an event into a task for a role or a run of
# checks. A trigger's prompt names its template, a Markdown file beside this one.
#
# Every lens reviews each commit; a batch of fixes is reviewed by Bugs and Tests, and by the
# lenses guarded by raised-finding only if they raised one of its findings. The super review's
# three lenses review the whole codebase every ten commits, and the fixes of their own findings.
# The reviews' agents share the review tab, and the super review's, its merge pass included, its
# own.

[triggers.fit-review]
on = "task_landed"
role = "fit-reviewer"
prompt = "lens-review.md"
guards = ["review-rounds", "raised-finding"]
tab = "review"

[triggers.bugs-review]
on = "task_landed"
role = "bugs-reviewer"
prompt = "lens-review.md"
guards = ["review-rounds"]
tab = "review"

[triggers.tests-review]
on = "task_landed"
role = "tests-reviewer"
prompt = "lens-review.md"
guards = ["review-rounds"]
tab = "review"

[triggers.logic-review]
on = "task_landed"
role = "logic-reviewer"
prompt = "lens-review.md"
guards = ["review-rounds", "raised-finding"]
tab = "review"

[triggers.security-review]
on = "task_landed"
role = "security-reviewer"
prompt = "lens-review.md"
guards = ["review-rounds", "raised-finding"]
tab = "review"

[triggers.performance-review]
on = "task_landed"
role = "performance-reviewer"
prompt = "lens-review.md"
guards = ["review-rounds", "raised-finding"]
tab = "review"

[triggers.merge-pass]
on = "reviews_finished"
role = "reviewer"
prompt = "merge-pass.md"
when = { findings = "some", review = ["commit", "batch", "set"] }
tab = "review"

[triggers.super-merge-pass]
on = "reviews_finished"
role = "reviewer"
prompt = "merge-pass.md"
when = { findings = "some", review = "super" }
tab = "super-review"

[triggers.super-review]
on = "commits"
role = ["style-reviewer", "drift-reviewer", "scaling-reviewer"]
prompt = "super-review.md"
when = { origin = ["manual", "planner"] }
guards = ["suggestions-pending"]
every = 10
manual = true
label = "Super review"
tab = "super-review"

[triggers.super-fix-review]
on = "task_landed"
role = ["style-reviewer", "drift-reviewer", "scaling-reviewer"]
prompt = "lens-review.md"
when = { review = "batch" }
guards = ["review-rounds", "raised-finding"]
tab = "review"

[triggers.configure-checks]
on = "manual"
role = "configurator"
prompt = "configure-checks.md"
manual = true
label = "Set up checks"

[triggers.set-up-verification]
on = "session_started"
role = "configurator"
prompt = "configure-checks.md"
when = { verification = "missing" }
guards = ["not-queued"]

[triggers.startup-check]
on = "session_started"
checks = "task-checks"
when = { verification = "configured" }

[triggers.startup-fix]
on = "startup_check_failed"
role = "coder"
prompt = "startup-fix.md"
draft = true
