# The skills its agents get, by name: orbit's own, or the project's in .orbit/skills/.
# skills = ["code-style", "review-drift"]

# [roles.scaling-reviewer]
# What its agents are told about their job: the text, or a Markdown file under .orbit/ it names.
# instructions: orbit's own super-lens-reviewer.md
# Its tasks' model, an alias such as "opus" or a full id; unset, the user config's, else the CLI's.
# model = "opus"
# How its tasks may use the CLI's tools: "off", "restricted" (read and search) or "full".
# tool_access = "restricted"
# The orbit tools its agents may call.
# tools = ["get_task", "complete_task", "report_progress", "give_up", "report_finding"]
# Whether its agents may report a finding as blocking with report_finding.
# blocking_findings = false
# Whether its agents' claims of being done are verified.
# verify = false
# How long its agents may take, in minutes; unset, no limit.
# timeout_minutes: unset
# The lane that runs its agents, a plain name; a lane runs one task at a time.
# lane = "review"
# Where its agents work: "worktree", "snapshot", "checkout", "none" or "copy".
# workspace = "snapshot"
# Whether you talk to it, as you do the planner, rather than it taking tasks.
# conversation = false
# Whether its finished work is committed and merged.
# merge = false
# Whether it runs at all.
# enabled = true
# Its effort: "low", "medium", "high", "xhigh" or "max"; unset, the user config's, else the CLI's.
# effort: unset
# The runtime its agents run on: "claude" or "kiro". Left out, the user config's, else "claude".
# runtime = "claude"
# The other conversational roles a conversational role may consult, by name.
# consults = []
# Consultations it may start in an hour; 0, no limit.
# consult_limit_per_hour = 6
# How long its copy is kept after its conversation's last turn, in hours.
# copy_ttl_hours = 24.0
# The skills its agents get, by name: orbit's own, or the project's in .orbit/skills/.
# skills = ["code-style", "review-scaling"]

# A role of your own, which must set its instructions. For example:
# [roles.license-reviewer]
# What its agents are told about their job: the text, or a Markdown file under .orbit/ it names.
# instructions = "roles/license-reviewer.md"
# Whether its agents' claims of being done are verified.
# verify = false
# The lane that runs its agents, a plain name; a lane runs one task at a time.
# lane = "licenses"
# Where its agents work: "worktree", "snapshot", "checkout", "none" or "copy".
# workspace = "snapshot"
# Whether its finished work is committed and merged.
# merge = false

# The triggers that turn events into tasks or check runs, by name: the shipped ones, and your own.

# [triggers.fit-review]
# The event it fires on, such as "task_landed", "commits" or "manual".
# on = "task_landed"
# The role of the task it queues, or a list of roles, queuing one task each.
# role = "fit-reviewer"
# Instead of a role, the checks it runs: "task-checks", or a named set.
# checks: unset
# The task's prompt: the text, or a Markdown file under .orbit/ it names.
# prompt: orbit's own lens-review.md
# The events it takes, by their fields, each a value or a list of values.
# when = {}
# What may hold it back: review-rounds, raised-finding, suggestions-pending, not-queued or dedupe.
# guards = ["review-rounds", "raised-finding"]
# With on = "commits", how many matching landings it fires after.
# every: unset
# Whether you can fire it yourself.
# manual = false
# What it's called where you fire it; a manual trigger needs one.
# label: unset
# Whether its task is added as a draft, for you to accept.
# draft = false
# Whether it fires at all.
# enabled = true

